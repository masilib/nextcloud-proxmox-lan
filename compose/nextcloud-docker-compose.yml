version: "3.9"

services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped

    dns:
      - 172.23.0.100
    networks:
      lanufficio:
        ipv4_address: 172.23.0.102

    depends_on:
      - db
      - redis

    environment:
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_PASSWORD}
      REDIS_HOST: redis

    volumes:
      - ./nextcloud/html:/var/www/html
      - ./docker-entrypoint-hooks.d:/docker-entrypoint-hooks.d


    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`ufficio.local`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.docker.network=lanufficio"
      - "traefik.http.routers.nextcloud.tls.certresolver=myresolver"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
  
  db:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped

    networks:
      lanufficio:
        ipv4_address: 172.23.0.103

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      TZ: Europe/Rome

    command: --transaction-isolation=READ-COMMITTED --innodb_read_only_compressed=OFF

    volumes:
      - ./database:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    networks:
      lanufficio:
        ipv4_address: 172.23.0.104

    environment:
      TZ: Europe/Rome

networks:
  lanufficio:
    external: true